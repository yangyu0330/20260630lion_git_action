name: AI Assisted PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-assisted-pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Print workflow information
        run: |
          echo "Workflow started"
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head branch: ${{ github.head_ref }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show changed files
        run: |
          BASE_REF="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch origin "$BASE_REF"
          echo "Base branch: $BASE_REF"
          echo "Changed files:"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed_files.txt
          if [ -s changed_files.txt ]; then
            cat changed_files.txt
          else
            echo "No changed files detected."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Create AI summary prompt
        run: |
          BASE_REF="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed_files.txt

          {
            echo "다음 Pull Request 변경 내용을 바탕으로 코드 리뷰 요약을 작성해줘."
            echo ""
            echo "[프로젝트 방향성과 목적]"
            echo "- 이 저장소는 GitHub Actions 과제 실습용 Node.js 프로젝트이다."
            echo "- 목표는 Pull Request가 생성되었을 때 GitHub Actions가 자동 실행되는 흐름을 이해하는 것이다."
            echo "- workflow는 변경 파일 확인, 테스트, 빌드, AI 리뷰용 prompt 생성을 단계적으로 수행한다."
            echo "- 실제 AI API 호출 전에는 변경 내용을 AI에게 전달할 prompt를 만드는 것까지 구현한다."
            echo ""
            echo "[변경된 파일 목록]"
            if [ -s changed_files.txt ]; then
              cat changed_files.txt
            else
              echo "변경된 파일이 없습니다."
            fi
            echo ""
            echo "[요약 형식]"
            echo "1. 주요 변경 사항"
            echo "2. 테스트 필요 부분"
            echo "3. 리뷰어가 확인해야 할 부분"
            echo "4. GitHub Actions 관점에서 확인할 부분"
          } > ai_review_prompt.txt

          cat ai_review_prompt.txt

      - name: Upload AI prompt artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-prompt
          path: ai_review_prompt.txt
